<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:include src="/WEB-INF/includes/head.xhtml">
    <ui:param name="title" value="Book Management - Admin Portal" />
</ui:include>

<h:body>
    <ui:include src="/WEB-INF/includes/admin-header.xhtml">
        <ui:param name="activePage" value="books" />
    </ui:include>

    <main class="container">
        <!-- RBAC Guard container -->
        <div id="adminAccessGuard">
            <div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <h1 class="page-title">Book Management</h1>
                    <p class="page-subtitle">Restricted to Admin role. Manage book catalog, inventory stock, and pricing.</p>
                </div>
                <button class="btn btn-primary" onclick="openAddBookModal()">
                    <i class="bi bi-plus-lg" style="margin-right: 0.4rem;"></i> Add New Book
                </button>
            </div>

            <!-- Filter & Search Toolbar -->
            <div style="margin-bottom: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; justify-content: space-between;">
                <div style="position: relative; flex: 1; min-width: 250px; max-width: 400px;">
                    <i class="bi bi-search" style="position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem;"></i>
                    <input type="text" id="adminBookSearch" class="input-field" placeholder="Search title, ISBN, author..." style="width: 100%; padding-left: 2.5rem;" />
                </div>
                <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
                    <select id="adminBookCategoryFilter" class="select-field" style="width: 170px;">
                        <option value="">All Categories</option>
                    </select>
                    <select id="adminBookStockFilter" class="select-field" style="width: 150px;">
                        <option value="">All Stock Status</option>
                        <option value="INSTOCK">In Stock</option>
                        <option value="OUTOFSTOCK">Out of Stock</option>
                    </select>
                </div>
            </div>

            <!-- Book Inventory Table -->
            <section class="card-table-wrap">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Book Title &amp; Author</th>
                            <th>ISBN Code</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminBookTableBody">
                        <!-- Rendered dynamically via admin-books.js -->
                    </tbody>
                </table>
            </section>
        </div>
    </main>

    <ui:include src="/WEB-INF/includes/footer.xhtml" />

    <!-- Add/Edit Book Modal -->
    <div id="addBookModal" class="modal-backdrop">
        <div class="modal-content" style="max-width: 650px;">
            <button class="modal-close" onclick="closeModals()">&#215;</button>
            <h2 id="modalFormTitle" style="font-size: 1.35rem; font-weight: 800; margin-bottom: 1.25rem;">Add New Book</h2>
            
            <form id="addBookForm">
                <input type="hidden" name="bookId" id="bookIdInput" />

                <div class="form-group" style="margin-bottom: 1.1rem;">
                    <label class="form-label">Book Title *</label>
                    <input type="text" name="title" class="input-field" required="required" placeholder="Enter book title" style="width: 100%;" />
                </div>

                <!-- Author Selection Section -->
                <div class="form-group" style="margin-bottom: 1.1rem; background: var(--bg-surface, #f8fafc); padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color, #e2e8f0);">
                    <label class="form-label" style="font-weight: 700;">Author Information *</label>
                    <div style="display: flex; gap: 1.5rem; margin-bottom: 0.75rem;">
                        <label style="cursor: pointer; display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; font-weight: 600;">
                            <input type="radio" name="authorMode" value="EXISTING" checked="checked" onchange="toggleAuthorMode('EXISTING')" />
                            Select Existing Author
                        </label>
                        <label style="cursor: pointer; display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; font-weight: 600;">
                            <input type="radio" name="authorMode" value="NEW" onchange="toggleAuthorMode('NEW')" />
                            Add New Author Details
                        </label>
                    </div>

                    <div id="existingAuthorSection">
                        <select id="authorSelect" name="authorId" class="select-field" style="width: 100%;">
                            <option value="">-- Select Author --</option>
                        </select>
                    </div>

                    <div id="newAuthorSection" style="display: none;">
                        <div class="form-group" style="margin-bottom: 0.75rem;">
                            <label class="form-label" style="font-size: 0.85rem;">Author Full Name *</label>
                            <input type="text" id="newAuthorNameInput" name="newAuthorName" class="input-field" placeholder="e.g. Robert C. Martin" style="width: 100%;" />
                        </div>
                        <div class="form-group">
                            <label class="form-label" style="font-size: 0.85rem;">Author Biography (Optional)</label>
                            <input type="text" id="newAuthorBioInput" name="newAuthorBio" class="input-field" placeholder="Short author biography..." style="width: 100%;" />
                        </div>
                    </div>
                </div>

                <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <select id="bookCategorySelect" name="categoryId" class="select-field" style="width: 100%;">
                            <option value="">-- Select Category --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">ISBN Code</label>
                        <input type="text" name="isbn" class="input-field" placeholder="e.g. 978-0132350884" style="width: 100%;" />
                    </div>
                </div>

                <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem;">
                    <div class="form-group">
                        <label class="form-label">List Price ($) *</label>
                        <input type="number" name="price" class="input-field" required="required" min="0" step="0.01" placeholder="25.00" style="width: 100%;" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Discount Price ($)</label>
                        <input type="number" name="discountPrice" class="input-field" min="0" step="0.01" placeholder="19.99" style="width: 100%;" />
                    </div>
                </div>

                <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Stock Quantity *</label>
                        <input type="number" name="stockQuantity" class="input-field" required="required" min="0" value="10" style="width: 100%;" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Published Year</label>
                        <input type="number" name="publishedYear" class="input-field" min="1000" max="2099" value="2024" style="width: 100%;" />
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="input-field" rows="3" placeholder="Enter book summary or description..." style="width: 100%;"></textarea>
                </div>

                <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; margin-bottom: 1.25rem;">
                    <div class="form-group">
                        <label class="form-label">Cover Image URL</label>
                        <input type="url" name="coverImage" class="input-field" placeholder="https://example.com/cover.jpg" style="width: 100%;" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Pages</label>
                        <input type="number" name="pages" class="input-field" min="1" placeholder="350" style="width: 100%;" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Language</label>
                        <input type="text" name="language" class="input-field" value="Tiếng Việt" style="width: 100%;" />
                    </div>
                </div>

                <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-secondary" onclick="closeModals()">Cancel</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check2-circle" style="margin-right: 0.3rem;"></i> Save Book
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="#{request.contextPath}/js/common/core.js"></script>
    <script src="#{request.contextPath}/js/api/api-client.js"></script>
    <script src="#{request.contextPath}/js/api/book-api.js"></script>
    <script src="#{request.contextPath}/js/admin/admin-books.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (checkAdminAccessGuard()) {
                fetchAdminBookTable();
            }
        });
    </script>
</h:body>
</html>
