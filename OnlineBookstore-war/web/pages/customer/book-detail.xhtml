<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:include src="/WEB-INF/includes/head.xhtml">
    <ui:param name="title" value="Book Details - Online Bookstore" />
</ui:include>

<h:body>
    <ui:include src="/WEB-INF/includes/customer-header.xhtml">
        <ui:param name="activePage" value="books" />
    </ui:include>

    <main class="container">
        <div style="margin-bottom: 1.5rem;">
            <a href="#{request.contextPath}/pages/customer/books.xhtml" class="btn btn-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Back to Catalog
            </a>
        </div>

        <div id="standaloneBookDetail" class="card-detail-wrap">
            <!-- Rendered dynamically by books.js -->
        </div>
    </main>

    <ui:include src="/WEB-INF/includes/footer.xhtml" />

    <script src="#{request.contextPath}/js/common/core.js"></script>
    <script src="#{request.contextPath}/js/api/api-client.js"></script>
    <script src="#{request.contextPath}/js/api/book-api.js"></script>
    <script src="#{request.contextPath}/js/customer/books.js"></script>
    <script>
        //<![CDATA[
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const bookId = urlParams.get('id');
            if (bookId) {
                loadStandaloneBookDetail(bookId);
            } else {
                document.getElementById('standaloneBookDetail').innerHTML = '<div class="empty-state"><div class="empty-title">Book ID Missing</div></div>';
            }
        });
        //]]>
    </script>
</h:body>
</html>
