<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:include src="/WEB-INF/includes/head.xhtml">
    <ui:param name="title" value="Book Catalog - Customer Storefront" />
</ui:include>

<h:body>
    <ui:include src="/WEB-INF/includes/customer-header.xhtml">
        <ui:param name="activePage" value="books" />
    </ui:include>

    <main class="container">
        <div class="page-header">
            <h1 class="page-title">Book Catalog</h1>
            <p class="page-subtitle">Search, filter, and discover books across all categories.</p>
        </div>

        <!-- Search & Filter Bar -->
        <section class="filter-bar">
            <div class="search-box">
                <input type="text" id="searchInput" class="input-field" placeholder="Search by title, author, or ISBN..." />
            </div>
            <div style="display: flex; gap: 0.75rem;">
                <select id="categoryFilter" class="select-field" onchange="fetchBooks()">
                    <option value="">All Categories</option>
                </select>
                <button class="btn btn-secondary" onclick="fetchBooks()">
                    <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>
            </div>
        </section>

        <!-- Book Grid -->
        <section id="bookGrid" class="book-grid">
            <!-- Rendered dynamically by books.js -->
        </section>
    </main>

    <ui:include src="/WEB-INF/includes/footer.xhtml" />

    <!-- Book Detail Modal -->
    <div id="detailModal" class="modal-backdrop">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModals()">&#215;</button>
            <div id="detailModalBody"></div>
        </div>
    </div>

    <script src="#{request.contextPath}/js/common/core.js"></script>
    <script src="#{request.contextPath}/js/api/api-client.js"></script>
    <script src="#{request.contextPath}/js/api/book-api.js"></script>
    <script src="#{request.contextPath}/js/customer/books.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchBooks();
        });
    </script>
</h:body>
</html>
