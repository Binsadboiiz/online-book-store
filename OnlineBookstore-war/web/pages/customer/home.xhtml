<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:include src="/WEB-INF/includes/head.xhtml">
    <ui:param name="title" value="Online Bookstore - Customer Storefront" />
</ui:include>

<h:body>
    <ui:include src="/WEB-INF/includes/customer-header.xhtml">
        <ui:param name="activePage" value="home" />
    </ui:include>

    <main class="container">
        <!-- Hero Section -->
        <section class="hero">
            <h1 class="hero-title">Minimalist Knowledge Space.</h1>
            <p class="hero-subtitle">Discover hand-picked books across technology, architecture, science, and literature in our clean monochrome catalog.</p>
            <div style="display: flex; gap: 1rem;">
                <a href="#{request.contextPath}/pages/customer/books.xhtml" class="btn btn-primary">
                    <i class="bi bi-compass" style="margin-right: 0.4rem;"></i> Browse Catalog
                </a>
                <a href="#{request.contextPath}/pages/customer/cart.xhtml" class="btn btn-secondary">
                    <i class="bi bi-cart3" style="margin-right: 0.4rem;"></i> View Cart
                </a>
            </div>
        </section>

        <!-- Featured Section Header -->
        <div class="section-header">
            <div>
                <h2 class="section-title">Featured Titles</h2>
                <p class="section-desc">Hand-selected recommendations for curious minds.</p>
            </div>
            <a href="#{request.contextPath}/pages/customer/books.xhtml" class="btn btn-secondary btn-sm">
                Explore All <i class="bi bi-arrow-right" style="margin-left: 0.3rem;"></i>
            </a>
        </div>

        <!-- Book Grid -->
        <section id="bookGrid" class="book-grid">
            <!-- Rendered dynamically via books.js -->
        </section>
    </main>

    <ui:include src="/WEB-INF/includes/footer.xhtml" />

    <!-- Book Detail Modal -->
    <div id="detailModal" class="modal-backdrop">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModals()">&#215;</button>
            <div id="detailModalBody"></div>
        </div>
    </div>

    <script src="#{request.contextPath}/js/core.js"></script>
    <script src="#{request.contextPath}/js/api-client.js"></script>
    <script src="#{request.contextPath}/js/book-api.js"></script>
    <script src="#{request.contextPath}/js/books.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchBooks('', 6);
        });
    </script>
</h:body>
</html>
