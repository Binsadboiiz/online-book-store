<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:include src="/WEB-INF/includes/head.xhtml">
    <ui:param name="title" value="Shopping Cart &amp; Checkout - Online Bookstore" />
</ui:include>

<h:body>
    <ui:include src="/WEB-INF/includes/customer-header.xhtml">
        <ui:param name="activePage" value="cart" />
    </ui:include>

    <main class="container">
        <div class="page-header">
            <h1 class="page-title">Shopping Cart</h1>
            <p class="page-subtitle">Review items in your cart and proceed to checkout.</p>
        </div>

        <div id="cartContainer">
            <!-- Rendered dynamically by cart.js -->
        </div>
    </main>

    <ui:include src="/WEB-INF/includes/footer.xhtml" />

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="modal-backdrop">
        <div class="modal-content" style="max-width: 550px;">
            <button class="modal-close" onclick="closeModals()">&#215;</button>
            <h2 style="font-size: 1.35rem; font-weight: 800; margin-bottom: 1.25rem;">Complete Order Checkout</h2>
            
            <form id="checkoutForm">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label class="form-label" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Recipient Full Name *</label>
                    <input type="text" name="recipientName" class="input-field" required="required" placeholder="e.g. John Doe" style="width: 100%;" />
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label class="form-label" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Recipient Phone Number *</label>
                    <input type="text" name="recipientPhone" class="input-field" required="required" placeholder="e.g. 0912345678" style="width: 100%;" />
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label class="form-label" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Shipping Address *</label>
                    <textarea name="shippingAddress" class="input-field" required="required" rows="2" placeholder="Street address, District, City..." style="width: 100%;"></textarea>
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label class="form-label" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Payment Method *</label>
                    <select name="paymentMethod" class="select-field" style="width: 100%;">
                        <option value="COD">Cash On Delivery (COD)</option>
                        <option value="BANK_TRANSFER">Bank Transfer (VNPAY / QR)</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="form-label" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Order Note (Optional)</label>
                    <input type="text" name="note" class="input-field" placeholder="Special delivery instructions..." style="width: 100%;" />
                </div>

                <div style="display: flex; gap: 0.75rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeModals()">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="padding: 0.75rem 1.5rem; font-weight: 700;">
                        <i class="bi bi-check2-circle" style="margin-right: 0.4rem;"></i> Confirm Order
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="#{request.contextPath}/js/common/core.js"></script>
    <script src="#{request.contextPath}/js/api/api-client.js"></script>
    <script src="#{request.contextPath}/js/api/cart-api.js"></script>
    <script src="#{request.contextPath}/js/api/order-api.js"></script>
    <script src="#{request.contextPath}/js/customer/cart.js"></script>
</h:body>
</html>
