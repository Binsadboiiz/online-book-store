<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:include src="/WEB-INF/includes/head.xhtml">
    <ui:param name="title" value="Sign In - Online Bookstore" />
</ui:include>

<h:body style="background-color: var(--bg-body, #fafafa); display: flex; flex-direction: column; min-height: 100vh;">
    <ui:include src="/WEB-INF/includes/customer-header.xhtml">
        <ui:param name="activePage" value="login" />
    </ui:include>

    <main class="container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem;">
        <div style="width: 100%; max-width: 440px;">
            <div class="card-detail-wrap" style="padding: 2.5rem 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.05);">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <div class="brand-icon" style="display: inline-flex; width: 48px; height: 48px; background: #09090b; color: #fff; border-radius: 8px; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 0.75rem;">
                        <i class="bi bi-person-circle"></i>
                    </div>
                    <h1 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 0.35rem; color: var(--text-main, #09090b);">Sign In</h1>
                    <p style="font-size: 0.9rem; color: var(--text-muted, #71717a);">Enter your credentials to access your account.</p>
                </div>

                <!-- Alert banner -->
                <div id="loginAlert" style="display: none; padding: 0.85rem 1rem; border-radius: 6px; margin-bottom: 1.25rem; font-size: 0.875rem; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;"></div>

                <form id="loginForm">
                    <div class="form-group" style="margin-bottom: 1.25rem;">
                        <label class="form-label" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Username or Email *</label>
                        <input type="text" id="usernameInput" class="input-field" required="required" placeholder="e.g. admin or john@example.com" style="width: 100%;" />
                    </div>

                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label class="form-label" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Password *</label>
                        <input type="password" id="passwordInput" class="input-field" required="required" placeholder="••••••••" style="width: 100%;" />
                    </div>

                    <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                        <i class="bi bi-box-arrow-in-right"></i> Sign In
                    </button>
                </form>

                <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color, #e4e4e7); font-size: 0.875rem; color: var(--text-muted, #71717a);">
                    Don't have an account? 
                    <a href="#{request.contextPath}/pages/auth/register.xhtml" style="font-weight: 700; color: var(--text-main, #09090b); text-decoration: underline;">Create account</a>
                </div>
            </div>
        </div>
    </main>

    <ui:include src="/WEB-INF/includes/footer.xhtml" />

    <script src="#{request.contextPath}/js/core.js"></script>
    <script src="#{request.contextPath}/js/api-client.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const alertEl = document.getElementById('loginAlert');
            const submitBtn = document.getElementById('loginBtn');

            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const usernameOrEmail = document.getElementById('usernameInput').value.trim();
                    const password = document.getElementById('passwordInput').value;

                    if (!usernameOrEmail || !password) {
                        showError('Please enter both username/email and password.');
                        return;
                    }

                    setLoading(true);

                    try {
                        const response = await ApiClient.post('/auth/login', { usernameOrEmail, password });
                        
                        const data = response?.data || response;
                        const sessionId = data.sessionId || data.token;
                        const user = data.user;

                        if (sessionId &amp;&amp; user) {
                            saveSession(sessionId, user);

                            // Role-based Navigation
                            const urlParams = new URLSearchParams(window.location.search);
                            const redirect = urlParams.get('redirect');
                            const context = getContextPath();

                            if (redirect &amp;&amp; redirect.startsWith(context)) {
                                window.location.href = redirect;
                            } else if (user.role === 'admin') {
                                window.location.href = context + '/pages/admin/dashboard.xhtml';
                            } else {
                                window.location.href = context + '/pages/customer/home.xhtml';
                            }
                        } else {
                            throw new Error('Invalid response from authentication server.');
                        }
                    } catch (err) {
                        showError(err.message || 'Login failed. Please check your credentials and try again.');
                    } finally {
                        setLoading(false);
                    }
                });
            }

            function showError(msg) {
                alertEl.style.display = 'block';
                alertEl.textContent = msg;
            }

            function setLoading(loading) {
                if (loading) {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = `<i class="bi bi-arrow-repeat spin"></i> Signing in...`;
                    alertEl.style.display = 'none';
                } else {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<i class="bi bi-box-arrow-in-right"></i> Sign In`;
                }
            }
        });
    </script>
</h:body>
</html>
