<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:include src="/WEB-INF/includes/head.xhtml">
    <ui:param name="title" value="Register &amp; Sign In - Online Bookstore" />
</ui:include>

<h:body data-active-auth="register" style="background-color: var(--bg-body, #fafafa); display: flex; flex-direction: column; min-height: 100vh;">
    <ui:include src="/WEB-INF/includes/customer-header.xhtml">
        <ui:param name="activePage" value="register" />
    </ui:include>

    <main class="container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem;">
        <div class="auth-container">
            <div class="auth-card">
                <!-- Sliding Navigation Tabs -->
                <div class="auth-nav-tabs">
                    <div class="auth-tab-glider"></div>
                    <button type="button" id="tabLoginBtn" class="auth-tab">
                        <i class="bi bi-box-arrow-in-right"></i> Sign In
                    </button>
                    <button type="button" id="tabRegisterBtn" class="auth-tab active">
                        <i class="bi bi-person-plus"></i> Create Account
                    </button>
                </div>

                <!-- Sign In Form Panel -->
                <div id="loginFormPanel" class="auth-panel">
                    <div style="text-align: center; margin-bottom: 1.5rem;">
                        <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.35rem; color: var(--text-primary, #09090b);">Welcome Back</h1>
                        <p style="font-size: 0.875rem; color: var(--text-muted, #71717a);">Sign in to access your personal library and orders.</p>
                    </div>

                    <h:messages id="loginMessages" styleClass="alert-container" errorClass="alert alert-danger" infoClass="alert alert-success" />

                    <h:form id="loginForm">
                        <div class="form-group" style="margin-bottom: 1.25rem;">
                            <label class="form-label">Username or Email *</label>
                            <div class="input-icon-group">
                                <i class="bi bi-person input-icon-left"></i>
                                <h:inputText value="#{loginBean.usernameOrEmail}" required="true" styleClass="input-field" placeholder="e.g. admin or john@example.com" />
                            </div>
                        </div>

                        <div class="form-group" style="margin-bottom: 1.5rem;">
                            <label class="form-label">Password *</label>
                            <div class="input-icon-group">
                                <i class="bi bi-lock input-icon-left"></i>
                                <h:inputSecret value="#{loginBean.password}" required="true" styleClass="input-field" placeholder="••••••••" />
                                <button type="button" class="password-toggle-btn" aria-label="Toggle Password Visibility">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <h:commandButton value="Sign In" action="#{loginBean.login}" styleClass="btn btn-primary" style="width: 100%; padding: 0.75rem; font-weight: 600;" />
                    </h:form>
                </div>

                <!-- Register Form Panel -->
                <div id="registerFormPanel" class="auth-panel active">
                    <div style="text-align: center; margin-bottom: 1.5rem;">
                        <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.35rem; color: var(--text-primary, #09090b);">Join Reader Community</h1>
                        <p style="font-size: 0.875rem; color: var(--text-muted, #71717a);">Create your account in less than a minute.</p>
                    </div>

                    <h:messages id="regMessages" styleClass="alert-container" errorClass="alert alert-danger" infoClass="alert alert-success" />

                    <h:form id="registerForm">
                        <div class="form-group" style="margin-bottom: 1.1rem;">
                            <label class="form-label">Username *</label>
                            <div class="input-icon-group">
                                <i class="bi bi-person input-icon-left"></i>
                                <h:inputText value="#{registerBean.username}" required="true" styleClass="input-field" placeholder="e.g. john_doe" />
                            </div>
                        </div>

                        <div class="form-group" style="margin-bottom: 1.1rem;">
                            <label class="form-label">Email Address *</label>
                            <div class="input-icon-group">
                                <i class="bi bi-envelope input-icon-left"></i>
                                <h:inputText value="#{registerBean.email}" required="true" styleClass="input-field" placeholder="john@example.com" />
                            </div>
                        </div>

                        <div class="form-group" style="margin-bottom: 1.1rem;">
                            <label class="form-label">Full Name *</label>
                            <div class="input-icon-group">
                                <i class="bi bi-card-text input-icon-left"></i>
                                <h:inputText value="#{registerBean.fullName}" required="true" styleClass="input-field" placeholder="e.g. John Doe" />
                            </div>
                        </div>

                        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.5rem;">
                            <div class="form-group">
                                <label class="form-label">Password *</label>
                                <div class="input-icon-group">
                                    <i class="bi bi-lock input-icon-left"></i>
                                    <h:inputSecret value="#{registerBean.password}" required="true" styleClass="input-field" placeholder="••••••••" />
                                    <button type="button" class="password-toggle-btn" aria-label="Toggle Password Visibility">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Confirm *</label>
                                <div class="input-icon-group">
                                    <i class="bi bi-check2-circle input-icon-left"></i>
                                    <h:inputSecret value="#{registerBean.confirmPassword}" required="true" styleClass="input-field" placeholder="••••••••" />
                                </div>
                            </div>
                        </div>

                        <h:commandButton value="Create Account" action="#{registerBean.register}" styleClass="btn btn-primary" style="width: 100%; padding: 0.75rem; font-weight: 600;" />
                    </h:form>
                </div>
            </div>
        </div>
    </main>

    <ui:include src="/WEB-INF/includes/footer.xhtml" />
</h:body>
</html>
