<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">
    <header class="navbar navbar-admin">
        <div class="nav-container">
            <a href="#{request.contextPath}/pages/admin/dashboard.xhtml" class="brand">
                <span class="brand-icon brand-icon-admin"><i class="bi bi-shield-lock-fill"></i></span>
                <span>ADMIN PORTAL</span>
            </a>
            
            <nav class="nav-menu">
                <a href="#{request.contextPath}/pages/admin/dashboard.xhtml" class="nav-link #{activePage == 'dashboard' ? 'active' : ''}">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
                <a href="#{request.contextPath}/pages/admin/books.xhtml" class="nav-link #{activePage == 'books' ? 'active' : ''}">
                    <i class="bi bi-journals"></i> Book Management
                </a>
                <a href="#{request.contextPath}/pages/admin/users.xhtml" class="nav-link #{activePage == 'users' ? 'active' : ''}">
                    <i class="bi bi-people"></i> Users
                </a>
            </nav>

            <div class="nav-actions">
                <button class="btn btn-secondary btn-sm" onclick="toggleUserRole()" title="Switch Role for Testing">
                    <i class="bi bi-person-badge"></i> Role: <strong id="currentRoleBadge">Admin</strong> <i class="bi bi-arrow-repeat"></i>
                </button>
                <a href="#{request.contextPath}/pages/customer/home.xhtml" class="btn btn-primary btn-sm">
                    <i class="bi bi-shop"></i> Customer Store
                </a>
            </div>
        </div>
    </header>
</ui:composition>
