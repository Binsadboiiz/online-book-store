<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">
    <p:growl id="globalGrowl" showDetail="true" life="3500" />
    <header class="navbar navbar-admin">
        <div class="nav-container">
            <a href="#{request.contextPath}/pages/admin/dashboard.xhtml" class="brand">
                <span class="brand-icon brand-icon-admin"><i class="bi bi-shield-lock-fill"></i></span>
                <span>ADMIN PORTAL</span>
            </a>
            
            <nav class="nav-menu">
                <a href="#{request.contextPath}/pages/admin/dashboard.xhtml" class="nav-link #{activePage == 'dashboard' ? 'active' : ''}">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
                <a href="#{request.contextPath}/pages/admin/books.xhtml" class="nav-link #{activePage == 'books' ? 'active' : ''}">
                    <i class="bi bi-journals"></i> Books
                </a>
                <a href="#{request.contextPath}/pages/admin/authors.xhtml" class="nav-link #{activePage == 'authors' ? 'active' : ''}">
                    <i class="bi bi-person-badge"></i> Authors
                </a>
                <a href="#{request.contextPath}/pages/admin/users.xhtml" class="nav-link #{activePage == 'users' ? 'active' : ''}">
                    <i class="bi bi-people"></i> Users
                </a>
                <a href="#{request.contextPath}/swagger.xhtml" class="nav-link #{activePage == 'swagger' ? 'active' : ''}">
                    <i class="bi bi-code-slash"></i> API Docs
                </a>
            </nav>

            <div class="nav-actions">
                <ui:fragment rendered="#{authBean.loggedIn}">
                    <div style="display: flex; align-items: center; gap: 0.75rem;">
                        <span style="font-size: 0.9rem; font-weight: 600; color: #000000;">
                            <i class="bi bi-shield-check" style="margin-right: 0.3rem;"></i>
                            #{authBean.fullName != null ? authBean.fullName : authBean.username} (#{authBean.role})
                        </span>
                        <h:form style="display: inline;">
                            <h:commandLink action="#{authBean.logout}" onclick="if (typeof clearSession === 'function') clearSession();" styleClass="btn btn-primary btn-sm" style="text-decoration: none;">
                                <i class="bi bi-box-arrow-right"></i> Logout
                            </h:commandLink>
                        </h:form>
                    </div>
                </ui:fragment>
            </div>
        </div>
    </header>
</ui:composition>
